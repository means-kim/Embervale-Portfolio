<!doctype html><html lang="ko"><meta charset="utf-8"><title>AirBoss · Ice Summon · 24 frames</title>
<style>body{margin:24px;background:#171b27;color:#edf2ff;font:16px system-ui}button,input,select{font:inherit;margin:6px;padding:7px}canvas{width:min(78vh,90vw);height:auto;background:repeating-conic-gradient(#252b3b 0% 25%,#202636 0% 50%) 0/32px 32px}p{max-width:820px;line-height:1.7}img{max-width:100%}</style>
<h1>단팔 상승 · 얼음 소환 동작 v01</h1><p>24프레임 · 손 궤적 포함 · 1152px 셀 · PPU 24 · 중앙 피봇<br>00은 Idle 마스터에 동일한 투명 패딩만 추가. 이 미리보기는 아트 검토이며 Unity 클립은 생성하지 않았습니다.</p>
<div><button id="play">일시정지</button><label>재생 <select id="fps"><option>24</option><option>12</option><option>6</option></select> fps</label><label>배경 <select id="bg"><option value="">체크</option><option value="#101521">어둡게</option><option value="#dedee4">밝게</option></select></label><span id="label"></span></div>
<canvas id="view" width="1152" height="1152"></canvas><div><input id="frame" type="range" min="0" max="23" value="0" style="width:75%"></div>
<p>발동 이벤트 후보: 10~12. 실제 타이밍은 얼음 VFX와 연결하며 조절하세요. 24fps는 검토용 1초 재생입니다. 프레임별 갑옷·손·천의 미세 변화와 궤적 소멸은 최종 사용자 검토 대상입니다.</p>
<img src="contact_final_v01.jpg" alt="24프레임 전체 비교">
<script>const imgs=Array.from({length:24},(_,i)=>{const im=new Image();im.src=`frames/v01/AirBoss_Cast_OneArm_IceSummon_v01_${String(i).padStart(2,'0')}.png`;return im});const c=document.querySelector('#view'),ctx=c.getContext('2d'),slider=document.querySelector('#frame');let running=true,index=0,last=0;function draw(){ctx.clearRect(0,0,1152,1152);if(imgs[index].complete&&imgs[index].naturalWidth)ctx.drawImage(imgs[index],0,0);slider.value=index;document.querySelector('#label').textContent=`${String(index).padStart(2,'0')} / 23`;}document.querySelector('#play').onclick=()=>{running=!running;document.querySelector('#play').textContent=running?'일시정지':'재생'};slider.oninput=()=>{running=false;index=+slider.value;document.querySelector('#play').textContent='재생';draw()};document.querySelector('#bg').onchange=e=>c.style.background=e.target.value||'';function tick(t){if(running&&t-last>=1000/+document.querySelector('#fps').value){index=(index+1)%24;last=t;}draw();requestAnimationFrame(tick)}Promise.all(imgs.map(im=>im.decode())).then(()=>requestAnimationFrame(tick));</script></html>
