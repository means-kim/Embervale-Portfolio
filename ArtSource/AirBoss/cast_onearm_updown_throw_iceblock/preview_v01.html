<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AirBoss · Throw IceBlock · 32 frames</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c111b;color:#e5edff;font:15px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px}h1{font-size:26px;margin:8px 0}p{color:#aebbd1;line-height:1.6}.top{font-size:12px;letter-spacing:.15em;color:#7dc9e8}.stage{position:relative;max-width:660px;margin:auto;background:#191e29;border:1px solid #34425a;border-radius:12px;overflow:hidden}.stage.light{background:#ccd0d5}.stage.check{background-color:#888;background-image:linear-gradient(45deg,#aaa 25%,transparent 25%),linear-gradient(-45deg,#aaa 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aaa 75%),linear-gradient(-45deg,transparent 75%,#aaa 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}canvas{width:100%;height:auto;display:block}.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}button,select{background:#223049;color:#eaf4ff;border:1px solid #48607f;padding:9px 13px;border-radius:7px}input[type=range]{width:240px}#info{text-align:center;font-variant-numeric:tabular-nums;color:#8bddff}label{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:24px}.cell{background:#191e29;border:1px solid #26344a;border-radius:5px;overflow:hidden;text-align:center}.cell img{display:block;width:100%}.cell small{display:block;padding:5px}.note{font-size:13px}.grid.light .cell{background:#cdd1d6;color:#172133}@media(max-width:700px){.grid{grid-template-columns:repeat(4,1fr)}main{padding:15px}}
</style><main><div class="top">EMBERVEIL / AIRBOSS / ART PREVIEW</div><h1>OneArm UpDown · Throw IceBlock</h1><p>왼팔 상승 → 빈손으로 힘 모으기 → 사선 전방 투척 → 후행 → 대기 자세 복귀<br>32프레임 · 1152×1152 셀 · PPU 24 · 4×4 시트 두 장</p>
<div class="stage" id="stage"><canvas id="cv" width="1152" height="1152"></canvas></div>
<div class="controls"><button id="toggle">일시정지</button><button id="prev">이전</button><button id="next">다음</button><input id="seek" type="range" min="0" max="31" value="0"><select id="speed"><option value=".25">0.25× 느리게</option><option value=".5">0.5×</option><option value="1" selected>1× 제안 타이밍</option><option value="2">2×</option></select></div>
<div class="controls"><select id="bg"><option value="">어두운 배경</option><option value="light">밝은 배경</option><option value="check">투명 체커</option></select><label><input type="checkbox" id="safe">64px 여백</label><label><input type="checkbox" id="master">Idle 마스터 겹침</label></div><div id="info">이미지 로딩 중…</div><p class="note">제안 길이 2.4초. 15→16은 시트 경계이며 동작은 연속입니다. 이 화면은 아트 검토용이며 Unity 클립·공격 이벤트·게임 플레이 검증이 아닙니다.</p><div class="grid" id="grid"></div>
<script>
const times=[0.09,0.09,0.09,0.09,0.09,0.09,0.09,0.09,0.085,0.085,0.085,0.085,0.085,0.085,0.085,0.085,0.04,0.04,0.04,0.04,0.055,0.055,0.055,0.055,0.055,0.055,0.085,0.085,0.085,0.085,0.085,0.085], images=[], canvas=document.getElementById('cv'),ctx=canvas.getContext('2d');let frame=0,playing=true,elapsed=0,last=0,ready=false;const master=new Image();master.src='reference/AirBoss_Idle_Master_1152_v01_Throw_IceBlock.png';const phase=i=>i<10?'왼팔 상승':i<16?'힘 모으기 / 홀드':i<20?'전방 투척':i<26?'후행':'복귀';
for(let i=0;i<32;i++){const im=new Image();im.src='frames/final_v01/AirBoss_Cast_OneArm_UpDown_v01_'+String(i).padStart(2,'0')+'_Throw_IceBlock.png';images.push(im);const cell=document.createElement('div');cell.className='cell';cell.innerHTML='<img src="'+im.src+'"><small>'+String(i).padStart(2,'0')+'</small>';cell.onclick=()=>{frame=i;elapsed=0;playing=false;toggle.textContent='재생';draw()};grid.appendChild(cell);}
function draw(){if(!ready)return;ctx.clearRect(0,0,1152,1152);if(document.getElementById('master').checked){ctx.globalAlpha=.25;ctx.drawImage(master,0,0);ctx.globalAlpha=1;}ctx.drawImage(images[frame],0,0);if(safe.checked){ctx.strokeStyle='#ffd778';ctx.lineWidth=2;ctx.setLineDash([10,8]);ctx.strokeRect(64,64,1024,1024);ctx.setLineDash([]);ctx.strokeStyle='#72e2ff';ctx.beginPath();ctx.moveTo(556,576);ctx.lineTo(596,576);ctx.moveTo(576,556);ctx.lineTo(576,596);ctx.stroke();}seek.value=frame;info.textContent=String(frame).padStart(2,'0')+' / 31 · '+phase(frame)+' · '+(times[frame]*1000).toFixed(0)+'ms · '+(frame<16?'Part 1':'Part 2');}
function tick(now){const dt=last?(now-last)/1000:0;last=now;if(playing&&ready){elapsed+=Math.min(dt,.25)*Number(speed.value);while(elapsed>=times[frame]){elapsed-=times[frame];frame=(frame+1)%32;}draw();}requestAnimationFrame(tick);}
toggle.onclick=()=>{playing=!playing;toggle.textContent=playing?'일시정지':'재생';};prev.onclick=()=>{playing=false;toggle.textContent='재생';frame=(frame+31)%32;elapsed=0;draw()};next.onclick=()=>{playing=false;toggle.textContent='재생';frame=(frame+1)%32;elapsed=0;draw()};seek.oninput=()=>{playing=false;toggle.textContent='재생';frame=Number(seek.value);elapsed=0;draw()};bg.onchange=()=>{stage.className='stage '+bg.value;grid.className='grid '+bg.value};safe.onchange=draw;document.getElementById('master').onchange=draw;Promise.all([...images,master].map(im=>im.decode())).then(()=>{ready=true;draw();requestAnimationFrame(tick)}).catch(e=>{info.textContent='이미지 로딩 오류: '+e.message;});
</script></main></html>
