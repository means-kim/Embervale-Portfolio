<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AirBoss · 화면 방향 얼음 밀기</title>
<style>body{margin:0;background:#171c29;color:#e8f0ff;font:15px/1.65 system-ui}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{max-width:900px;color:#b7c5db}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #566783;border-radius:7px;background:#25344c;color:inherit;padding:7px 12px}canvas{display:block;width:min(78vh,100%);height:auto;margin:18px 0;background:repeating-conic-gradient(#252e40 0% 25%,#202737 0% 50%) 0/28px 28px;border:1px solid #3d4c67;border-radius:10px}.scrub{display:flex;gap:14px;align-items:center;max-width:780px}input{flex:1}#number{font-variant-numeric:tabular-nums}#phase{color:#9fdffe}a{color:#9fdffe}.links{display:flex;gap:16px;flex-wrap:wrap}details{margin:20px 0}details img{max-width:100%}</style>
<main><h1>양손 얼음 밀기 · 화면을 향한 원근 동작</h1><p>Idle에서 얼음을 모아 화면 쪽으로 밀어내고 복귀합니다. 손의 원근감, 몸통 반동, 천의 후행과 흩날리는 얼음 파편을 함께 확인하세요.</p>
<div class="controls"><button id="play">일시정지</button><button id="prev" aria-label="이전 프레임">◀</button><button id="next" aria-label="다음 프레임">▶</button><label>속도 <select id="speed"><option value="0">구간별 속도</option><option value="12">12fps</option><option value="24">24fps</option><option value="6">6fps</option></select></label><label>배경 <select id="bg"><option value="">체크</option><option value="#0c1321">어둡게</option><option value="#eceef3">밝게</option></select></label><span id="phase">로딩 중</span></div>
<canvas id="view" width="1024" height="1024"></canvas><div class="scrub"><span id="number">00 / 23</span><input id="frame" aria-label="프레임" type="range" min="0" max="23" value="0"></div>
<p>24프레임 · 1024×1024 셀 · PPU 24 · 중앙 피봇. 첫·끝은 Idle 원본입니다. 구간별 속도는 준비와 복귀를 길게, 밀기를 짧게 둔 검토용 설정입니다. Unity 애니메이션 클립은 만들지 않았습니다.</p>
<div class="links"><a href="sheets/AirBoss_Cast_BothArms_IcePush_Part1_4x4_1024_v01.png">시트 1 · 00~15</a><a href="sheets/AirBoss_Cast_BothArms_IcePush_Part2_4x2_1024_v01.png">시트 2 · 16~23</a><a href="Cast_BothArms_IcePush_Production_v01.md">제작 기록</a></div><details><summary>전체 프레임 펼치기</summary><img src="contact_final_v01.jpg" alt="24프레임 전체 비교"></details></main>
<script>
const frames=Array.from({length:24},(_,i)=>{const im=new Image();im.src=`frames/v01/AirBoss_Cast_BothArms_IcePush_v01_${String(i).padStart(2,'0')}.png`;return im});
const exposure=[90,90,90,100,100,110,120,130,140,160,55,45,60,65,85,95,100,100,110,110,110,110,110,140];
const c=document.querySelector('#view'),ctx=c.getContext('2d');let running=true,index=0,last=0;
function phase(i){return i===0||i===23?'Idle':i<=5?'얼음 형성':i<=9?'당기기 · 준비':i<=13?'화면 쪽으로 밀기':i<=17?'파편 · 반동':'복귀 · 천의 잔흔들림';}
function draw(){ctx.clearRect(0,0,1024,1024);ctx.drawImage(frames[index],0,0);document.querySelector('#frame').value=index;document.querySelector('#number').textContent=String(index).padStart(2,'0')+' / 23';document.querySelector('#phase').textContent=phase(index);}
function pause(){running=false;document.querySelector('#play').textContent='재생';}
document.querySelector('#play').onclick=()=>{running=!running;last=performance.now();document.querySelector('#play').textContent=running?'일시정지':'재생';};document.querySelector('#frame').oninput=e=>{pause();index=+e.target.value;draw();};document.querySelector('#prev').onclick=()=>{pause();index=(index+23)%24;draw();};document.querySelector('#next').onclick=()=>{pause();index=(index+1)%24;draw();};document.querySelector('#bg').onchange=e=>c.style.background=e.target.value||'';
function tick(t){const fps=+document.querySelector('#speed').value,delay=fps?1000/fps:exposure[index];if(running&&t-last>=delay){index=(index+1)%24;last=t;draw();}requestAnimationFrame(tick);}
Promise.all(frames.map(im=>im.decode())).then(()=>{draw();requestAnimationFrame(tick);}).catch(()=>{pause();document.querySelector('#phase').textContent='이미지 경로를 확인하세요';});
</script></html>
