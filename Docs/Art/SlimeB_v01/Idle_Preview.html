<!doctype html><html lang="ko"><meta charset="utf-8"><title>B Slime Idle</title>
<style>body{background:#182332;color:#eef4ff;font:16px system-ui;max-width:900px;margin:32px auto}h1{font-size:24px}.stage{position:relative;width:768px;height:512px;background:#263041;border:1px solid #66778d}.sprite{position:absolute;inset:0;background-image:url('../../../Assets/04.Sprites/NormalMonster/SlimeB_v01/Idle/SlimeB_Idle_Sheet_v01.png');background-size:3072px 512px}.ground{position:absolute;left:0;right:0;top:448px;border-top:1px dashed #b4d7f4;pointer-events:none}button,select{font:inherit;margin:12px 8px 12px 0;padding:6px 12px}p{color:#c2cedf}</style>
<h1>B 슬라임 · Idle 4프레임</h1><p>768×512 셀 · 피봇 (384,64) · 높이 280 → 297 → 314 → 297px · 최대 +12.1%</p>
<div class="stage"><div class="sprite" id="sprite"></div><div class="ground"></div></div>
<button id="play">일시정지</button><button id="step">다음 프레임</button><label>재생 속도 <select id="fps"><option>4</option><option selected>6</option><option>8</option></select> fps</label><span id="frame"></span>
<p>점선은 접지선입니다. 3번은 1번과 같은 이미지이며, 3→0은 0→1의 역방향 변화입니다. 프레임 0은 기존 승인 PNG를 그대로 사용했습니다. 게임 씬의 조명·충돌 검증은 포함하지 않습니다.</p>
<script>let running=true,index=0,last=performance.now();const sprite=document.querySelector('#sprite'),label=document.querySelector('#frame');function draw(){sprite.style.backgroundPosition=(-768*index)+'px 0';label.textContent='프레임 '+index}document.querySelector('#play').onclick=()=>{running=!running;document.querySelector('#play').textContent=running?'일시정지':'재생';last=performance.now()};document.querySelector('#step').onclick=()=>{running=false;document.querySelector('#play').textContent='재생';index=(index+1)%4;draw()};function tick(t){if(running&&t-last>=1000/Number(document.querySelector('#fps').value)){index=(index+1)%4;last=t;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);</script></html>
