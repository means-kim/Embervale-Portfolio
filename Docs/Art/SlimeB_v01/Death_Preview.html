<!doctype html><html lang="ko"><meta charset="utf-8"><title>B Slime Death</title>
<style>body{background:#182332;color:#eef4ff;font:16px system-ui;max-width:900px;margin:32px auto}h1{font-size:24px}.stage{position:relative;width:768px;height:512px;background:#263041;border:1px solid #66778d}.sprite{position:absolute;inset:0;background-image:url('../../../Assets/04.Sprites/NormalMonster/SlimeB_v01/Death/SlimeB_Death_Sheet_v01.png');background-size:3072px 512px}.ground{position:absolute;left:0;right:0;top:448px;border-top:1px dashed #b4d7f4}button,select{font:inherit;margin:12px 8px 12px 0;padding:6px 12px}p{color:#c2cedf}</style>
<h1>B 슬라임 · Death 4프레임</h1><p>힘 빠짐 → 붕괴 → 소멸 → 잔해 · 8fps / 0.5초 · 반복 없음</p>
<div class="stage"><div class="sprite" id="sprite"></div><div class="ground"></div></div>
<button id="play">사망 재생</button><button id="step">다음 프레임</button><label>검토 속도 <select id="fps"><option value="3">느리게 3fps</option><option value="8" selected>실제 8fps</option></select></label><span id="frame"></span>
<p>셀 768×512 · 피봇 (384,64) · PPU 200. 점선은 고정 접지선입니다. 마지막 눈 더미를 유지하며, 실제 사망 판정·충돌 해제·페이드아웃·오브젝트 제거는 포함하지 않습니다.</p>
<script>let index=0,start=0,running=false;const sprite=document.querySelector('#sprite'),label=document.querySelector('#frame');function draw(){sprite.style.backgroundPosition=(-768*index)+'px 0';label.textContent=['0 힘 빠짐','1 붕괴','2 소멸','3 잔해'][index]}document.querySelector('#play').onclick=()=>{start=performance.now();running=true;index=0;draw()};document.querySelector('#step').onclick=()=>{running=false;index=(index+1)%4;draw()};function tick(t){if(running){let n=Math.floor((t-start)*Number(document.querySelector('#fps').value)/1000);index=Math.min(n,3);if(n>=4)running=false;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);</script></html>
