<!doctype html><html lang="ko"><meta charset="utf-8"><title>B Slime Move</title>
<style>body{background:#182332;color:#eef4ff;font:16px system-ui;max-width:900px;margin:32px auto}h1{font-size:24px}.stage{position:relative;width:768px;height:512px;background:#263041;border:1px solid #66778d}.sprite{position:absolute;inset:0;background-repeat:no-repeat}.ground{position:absolute;left:0;right:0;top:448px;border-top:1px dashed #b4d7f4;pointer-events:none}button,select{font:inherit;margin:12px 8px 12px 0;padding:6px 12px}p{color:#c2cedf}</style>
<h1>B 슬라임 · Move 6프레임</h1><p>셀 768×512 · 피봇 (384,64) · PPU 200 · 기본 10fps / 0.6초</p>
<div class="stage"><div class="sprite" id="sprite"></div><div class="ground"></div></div>
<button id="play">일시정지</button><button id="step">다음 프레임</button><button id="mode">Idle로 전환</button><label>Move 속도 <select id="fps"><option>6</option><option>8</option><option selected>10</option><option>12</option></select> fps</label><span id="frame"></span>
<p>점선은 고정 접지선입니다. Move 0은 Idle 기본 PNG와 동일합니다. 바닥에 붙은 자세로 앞부분을 늘리고 몸통과 뒤쪽을 모읍니다. 실제 월드 이동과 Animator 전환 설정은 포함하지 않습니다.</p>
<script>let running=true,index=0,last=performance.now(),mode='Move';const sprite=document.querySelector('#sprite'),label=document.querySelector('#frame'),root='../../../Assets/04.Sprites/NormalMonster/SlimeB_v01/';function draw(){sprite.style.backgroundImage='url("'+root+mode+'/SlimeB_'+mode+'_Sheet_v01.png")';sprite.style.backgroundSize=(mode==='Move'?4608:3072)+'px 512px';sprite.style.backgroundPosition=(-768*index)+'px 0';label.textContent=mode+' '+index}document.querySelector('#play').onclick=()=>{running=!running;document.querySelector('#play').textContent=running?'일시정지':'재생';last=performance.now()};document.querySelector('#step').onclick=()=>{running=false;document.querySelector('#play').textContent='재생';index=(index+1)%(mode==='Move'?6:4);draw()};document.querySelector('#mode').onclick=()=>{mode=mode==='Move'?'Idle':'Move';index=0;last=performance.now();document.querySelector('#mode').textContent=mode==='Move'?'Idle로 전환':'Move로 전환';draw()};function tick(t){const fps=mode==='Move'?Number(document.querySelector('#fps').value):6;if(running&&t-last>=1000/fps){index=(index+1)%(mode==='Move'?6:4);last=t;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);</script></html>
