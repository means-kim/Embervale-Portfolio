<!doctype html><html lang="ko"><meta charset="utf-8"><title>B Slime Hit</title>
<style>body{background:#182332;color:#eef4ff;font:16px system-ui;max-width:900px;margin:32px auto}h1{font-size:24px}.stage{position:relative;width:768px;height:512px;background:#263041;border:1px solid #66778d}.sprite{position:absolute;inset:0;background-image:url('../../../Assets/04.Sprites/NormalMonster/SlimeB_v01/Hit/SlimeB_Hit_Sheet_v01.png');background-size:2304px 512px}.ground{position:absolute;left:0;right:0;top:448px;border-top:1px dashed #b4d7f4}button,select{font:inherit;margin:12px 8px 12px 0;padding:6px 12px}p{color:#c2cedf}</style>
<h1>B 슬라임 · Hit 3프레임</h1><p>충격 → 반동 → 복원 · 12fps / 0.25초 · 반복 없음</p>
<div class="stage"><div class="sprite" id="sprite"></div><div class="ground"></div></div>
<button id="play">피격 재생</button><button id="step">다음 프레임</button><label>검토 속도 <select id="fps"><option value="4">느리게 4fps</option><option value="12" selected>실제 12fps</option></select></label><span id="frame"></span>
<p>셀 768×512 · 피봇 (384,64) · PPU 200. 복원 프레임은 기존 Idle00과 동일합니다. 점선은 접지선이며, 실제 넉백·피해 판정·Animator 전환은 포함하지 않습니다.</p>
<script>let index=2,start=0,running=false;const sprite=document.querySelector('#sprite'),label=document.querySelector('#frame');function draw(){sprite.style.backgroundPosition=(-768*index)+'px 0';label.textContent=['0 충격','1 반동','2 복원'][index]}document.querySelector('#play').onclick=()=>{start=performance.now();running=true;index=0;draw()};document.querySelector('#step').onclick=()=>{running=false;index=(index+1)%3;draw()};function tick(t){if(running){let n=Math.floor((t-start)*Number(document.querySelector('#fps').value)/1000);index=Math.min(n,2);if(n>=3)running=false;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);</script></html>
