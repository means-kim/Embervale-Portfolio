<!doctype html><meta charset="utf-8"><title>보스 눈 분출·낙하</title><style>body{background:#101b2a;color:#e6edfa;font:16px sans-serif;text-align:center;margin:25px}canvas{background:#0a111a;max-width:85vw;border:1px solid #34455a}button{padding:10px;margin:12px}</style><h1>눈 분출 → 낙하 → 소멸</h1><canvas id="c" width="600" height="600"></canvas><p id="s"></p><button onclick="start=performance.now()">다시 재생</button><label><input id="loop" type="checkbox" checked>반복 미리보기</label><p>8프레임 · Unity 클립은 반복 꺼짐 · 실제 보스 위치/크기 연결 전</p><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),img=new Image(),times=[0,.075,.15,.25,.38,.52,.68,.84];let start=performance.now();img.src='../../../Assets/04.Sprites/Backgrounds/Snow/FX_Boss_SlamBurstFall_Sheet_v01.png';function draw(now){let t=(now-start)/1000;if(document.getElementById('loop').checked&&t>1.7){start=now;t=0}ctx.clearRect(0,0,600,600);let k=0;times.forEach((v,i)=>{if(t>=v)k=i});let a=1;function smooth(x){return x*x*(3-2*x)}if(t>.52&&t<.84)a=1-.75*smooth((t-.52)/.32);else if(t>=.84)a=.25*(1-smooth(Math.min(1,(t-.84)/.21)));if(img.complete&&img.naturalWidth&&t<1.05){ctx.globalAlpha=a;ctx.drawImage(img,Math.round(k%4*443.5),k<4?0:444,443,443,0,0,600,600);ctx.globalAlpha=1}document.getElementById('s').textContent=t>=1.05?'소멸':(k+1)+' / 8 프레임';requestAnimationFrame(draw)}requestAnimationFrame(draw);</script>
