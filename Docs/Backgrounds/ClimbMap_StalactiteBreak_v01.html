<!doctype html><html lang="ko"><meta charset="utf-8"><title>종유석 파괴 효과 v01</title><style>body{max-width:1000px;margin:24px auto;background:#0b1320;color:#dce7f4;font:15px/1.6 system-ui;padding:0 20px}h1{font-size:24px}button{padding:8px 14px;background:#263e57;color:white;border:1px solid #5c7690;border-radius:5px;margin:4px;cursor:pointer}.stage{position:relative;width:100%;height:310px;background:#111e2d;overflow:hidden}.ground{position:absolute;top:260px;width:100%;border-top:1px dashed #6e8295}.sprite{position:absolute;width:220px;height:220px;background-image:url('../../Assets/04.Sprites/Backgrounds/ClimbMap/FX_Climb_StalactiteBreak_v01.png');background-size:440px 440px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{position:relative;height:200px;background:#111e2d;overflow:hidden}.tile .ground{top:168px}.tile .sprite{width:165px;height:165px;background-size:330px 330px}.label{text-align:center}a{color:#b3d7ff}p{color:#aebfd0}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style><h1>종유석 지면 충돌 · 파괴 4프레임</h1><p>지면 접촉점을 맞춘 파괴 시안입니다. 점선은 배치 기준선이며 이미지에 포함되지 않습니다.</p><div id="buttons"></div><button id="play">파괴 재생</button><span id="state"></span><div class="stage"><div class="ground"></div><div id="sprite" class="sprite"></div></div><div class="grid" id="grid"></div><p>80 → 100 → 140 → 400ms 시안. 마지막 잔해는 유지하거나 구현에서 페이드아웃할 수 있습니다. Unity 애니메이션·충돌 기능은 포함하지 않았습니다.</p><a href="ClimbMap_StalactiteBreak_v01.md">소재·구현 연결 기준</a><script>const frames=[{"name":"StalactiteBreak_00_Impact","x":0,"y":627,"anchorX":328,"anchorY":611,"ms":80,"width":627,"height":627,"pivot":{"x":0.5231259968102073,"y":0.02551834130781494},"internalID":21300000,"spriteID":"24e0d069fc034f0f97314eda1c966c74"},{"name":"StalactiteBreak_01_Burst","x":627,"y":627,"anchorX":320,"anchorY":610,"ms":100,"width":627,"height":627,"pivot":{"x":0.5103668261562998,"y":0.027113237639553422},"internalID":21300002,"spriteID":"330e6a5a33134db18cba7cc87d9db60e"},{"name":"StalactiteBreak_02_Settle","x":0,"y":0,"anchorX":330,"anchorY":552,"ms":140,"width":627,"height":627,"pivot":{"x":0.5263157894736842,"y":0.11961722488038273},"internalID":21300004,"spriteID":"9d4bdf18bff74d478ed1688167ade82b"},{"name":"StalactiteBreak_03_Debris","x":627,"y":0,"anchorX":310,"anchorY":555,"ms":400,"width":627,"height":627,"pivot":{"x":0.4944178628389155,"y":0.11483253588516751},"internalID":21300006,"spriteID":"8577e700afcf4d6fbbd92bc8d5f0f1c4"}];const labels=['충돌 직후','파편 확산','파편 낙하','바닥 잔해'];let timers=[];const s=document.querySelector('#sprite');function position(el,f,size,ground){el.style.left='calc(50% - '+f.anchorX/627*size+'px)';el.style.top=(ground-f.anchorY/627*size)+'px';el.style.backgroundPosition=(-(f.x/627)*size)+'px '+(-((627-f.y)/627)*size)+'px'}function show(i){position(s,frames[i],220,260);document.querySelector('#state').textContent=labels[i]}function stop(){timers.forEach(clearTimeout);timers=[]}frames.forEach((f,i)=>{let b=document.createElement('button');b.textContent=labels[i];b.onclick=()=>{stop();show(i)};document.querySelector('#buttons').append(b);let item=document.createElement('div');item.innerHTML='<div class="tile"><div class="ground"></div><div class="sprite"></div></div><div class="label">'+labels[i]+'</div>';position(item.querySelector('.sprite'),f,165,168);document.querySelector('#grid').append(item)});document.querySelector('#play').onclick=()=>{stop();show(0);let t=0;frames.slice(0,3).forEach((f,i)=>{t+=f.ms;timers.push(setTimeout(()=>show(i+1),t))})};show(0);</script></html>
