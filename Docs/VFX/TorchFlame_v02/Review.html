<!doctype html><html lang="ko"><meta charset="utf-8"><title>횃불 불꽃 비교</title><style>body{background:#202630;color:#eee;font:16px system-ui;margin:32px}main{display:flex;gap:40px}figure{margin:0}img{width:320px;height:480px;object-fit:contain}figcaption{margin:12px 0}button,input{margin:12px}p{max-width:850px;line-height:1.6}</style><h1>횃불 불꽃 리마스터</h1><p>원본 160×240 → 256×384. 동일 화면 크기 비교. 원본 클립과 같은 60fps 또는 느린 12fps로 비교할 수 있습니다. Unity 실제 렌더 검증은 별도입니다.</p><button id="play">일시정지</button><button id="speed">60fps</button><input id="seek" type="range" min="0" max="15" value="0"><span id="label">00</span><main><figure><figcaption>기존</figcaption><img id="before"></figure><figure><figcaption>수정</figcaption><img id="after"></figure></main><script>const a=[],b=[];for(let i=0;i<16;i++){let n=String(i).padStart(2,'0');a[i]=new Image;a[i].src=`Original/Flame_A_Soft_${n}.png`;b[i]=new Image;b[i].src=`../../../Assets/04.Sprites/Light/Flame_A_Soft_${n}.png`;}let frame=0,running=true,fps=60,last=0;const before=document.getElementById('before'),after=document.getElementById('after'),seek=document.getElementById('seek'),label=document.getElementById('label');function show(){before.src=a[frame].src;after.src=b[frame].src;seek.value=frame;label.textContent=String(frame).padStart(2,'0')}document.getElementById('play').onclick=e=>{running=!running;e.target.textContent=running?'일시정지':'재생'};document.getElementById('speed').onclick=e=>{fps=fps===60?12:60;e.target.textContent=fps+'fps'};seek.oninput=()=>{frame=+seek.value;running=false;document.getElementById('play').textContent='재생';show()};function tick(t){if(running&&t-last>=1000/fps){frame=(frame+1)%16;last=t;show()}requestAnimationFrame(tick)}show();requestAnimationFrame(tick);</script></html>
